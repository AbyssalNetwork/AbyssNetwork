<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss Network &mdash; Stats</title>
<style>
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #0f1020;
    color: #e8e8f0;
    margin: 0;
    padding: 40px;
  }
  h1 { color: #a855f7; letter-spacing: 2px; margin: 0 0 4px; }
  .sub { color: #6b7280; margin-bottom: 24px; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #2a2b45; }
  th { color: #7dd3fc; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
  tr:hover td { background: #1a1b35; }
  .kd { color: #4ade80; }
  #status { margin-top: 16px; font-size: 13px; color: #6b7280; }
</style>
</head>
<body>
  <h1>ABYSS NETWORK &mdash; STATS</h1>
  <div class="sub">Top players by kills &middot; refreshes automatically</div>
  <table>
    <thead>
      <tr><th>#</th><th>Player</th><th>Kills</th><th>Deaths</th><th>K/D</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="status">loading&hellip;</div>
<script>
  async function load() {
    const rows = document.getElementById('rows');
    const status = document.getElementById('status');
    try {
      const res = await fetch('/players');
      const players = await res.json();
      rows.innerHTML = '';
      players.forEach((p, i) => {
        const tr = document.createElement('tr');
        const kd = p.deaths > 0
          ? (p.kills / p.deaths).toFixed(2)
          : (p.kills > 0 ? '&infin;' : '&mdash;');
        tr.innerHTML = '<td>' + (i + 1) + '</td>' +
          '<td>' + escapeHtml(p.username) + '</td>' +
          '<td>' + p.kills + '</td>' +
          '<td>' + p.deaths + '</td>' +
          '<td class="kd">' + kd + '</td>';
        rows.appendChild(tr);
      });
      status.textContent = players.length + ' players &middot; ' + new Date().toLocaleTimeString();
    } catch (e) {
      status.textContent = 'failed to load: ' + e;
    }
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  load();
  setInterval(load, 10000);
</script>
</body>
</html>
